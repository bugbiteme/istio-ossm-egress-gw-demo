apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace-client-1.yaml
  - namespace-client-2.yaml
  - cm-client-1.yaml
  - cm-client-2.yaml
  - deployment-client-1.yaml
  - deployment-client-2.yaml
  - service-client-1.yaml
  - service-client-2.yaml
  - route-client-1.yaml
  - route-client-2.yaml
  # - peerauthentication-client-1.yaml


patches:
  - target:
      kind: Route
      name: internal-client-1
    patch: |-
      - op: replace
        path: /spec/host
        value: internal-client-1.apps.cluster-jj7tx.jj7tx.sandbox2671.opentlc.com
  - target:
      kind: Route
      name: internal-client-2
    patch: |-
      - op: replace
        path: /spec/host
        value: internal-client-2.apps.cluster-jj7tx.jj7tx.sandbox2671.opentlc.com
